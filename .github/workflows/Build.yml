name: Build k6a-daemon + Package Module

on:
  push:
    branches:
      - main
    paths:
      - 'k6a-daemon/**'
      - '.github/workflows/build.yml'
      - 'customize.sh'
      - 'service.sh'
      - 'bin/k6a-controller'
      - 'bin/k6a-lib.sh'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            k6a-daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('k6a-daemon/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25
        run: |
          sdkmanager --install "ndk;25.2.9519653" --sdk_root=$ANDROID_SDK_ROOT
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Configure Cargo linker
        run: |
          LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          AR="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          mkdir -p k6a-daemon/.cargo
          cat > k6a-daemon/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "$LINKER"
          ar = "$AR"
          EOF

      - name: Build k6a-daemon
        working-directory: k6a-daemon
        run: |
          cargo build --release --target aarch64-linux-android
          ls -lh target/aarch64-linux-android/release/k6a-daemon

      - name: Package flashable zip
        run: |
          BINARY="k6a-daemon/target/aarch64-linux-android/release/k6a-daemon"
          STAGING="/tmp/staging"
          OUT="/tmp/BadazZ89_k6a_Optimizer_v1.0.zip"

          mkdir -p "$STAGING/bin"
          mkdir -p "$STAGING/webroot"
          mkdir -p "$STAGING/config"
          mkdir -p "$STAGING/run"
          mkdir -p "$STAGING/icon"
          mkdir -p "$STAGING/META-INF/com/google/android"

          # Module metadata
          cp module.prop       "$STAGING/module.prop"
          cp customize.sh      "$STAGING/customize.sh"
          cp service.sh        "$STAGING/service.sh"
          cp system.prop       "$STAGING/system.prop"
          cp post-fs-data.sh   "$STAGING/post-fs-data.sh"
          cp boot-completed.sh "$STAGING/boot-completed.sh"

          # Config
          cp config/settings.conf  "$STAGING/config/settings.conf"
          cp config/freeze.conf    "$STAGING/config/freeze.conf"
          cp config/manual_profile "$STAGING/config/manual_profile"

          # Binaries
          cp bin/k6a-controller  "$STAGING/bin/k6a-controller"
          cp bin/k6a-lib.sh      "$STAGING/bin/k6a-lib.sh"
          cp bin/k6a-diagnose.sh "$STAGING/bin/k6a-diagnose.sh"
          cp "$BINARY"           "$STAGING/bin/k6a-daemon"
          chmod 755              "$STAGING/bin/k6a-daemon"
          chmod 755              "$STAGING/bin/k6a-controller"

          # Webroot
          cp webroot/index.html "$STAGING/webroot/index.html"
          cp webroot/ascii.txt  "$STAGING/webroot/ascii.txt"

          # Icon
          [ -f icon/icon.png ] && cp icon/icon.png "$STAGING/icon/icon.png"

          # META-INF
          echo "#MAGISK" > "$STAGING/META-INF/com/google/android/updater-script"

          cd "$STAGING"
          zip -r "$OUT" .
          ls -lh "$OUT"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: BadazZ89-k6a-Optimizer-v1.0
          path: /tmp/BadazZ89_k6a_Optimizer_v1.0.zip
          retention-days: 30
